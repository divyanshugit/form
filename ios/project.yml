name: Form
options:
  bundleIdPrefix: com.divyanshu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.24.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 3SYM4GK7B9
    CODE_SIGN_STYLE: Automatic

targets:
  Form:
    type: application
    platform: iOS
    sources:
      - path: Form/Sources
      - path: Form/Resources
    configFiles:
      Debug: Form/Config/Secrets.xcconfig
      Release: Form/Config/Secrets.xcconfig
    dependencies:
      - package: Supabase
    entitlements:
      path: Form/Form.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: Form/Info.plist
      properties:
        CFBundleDisplayName: Form
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Form uses the camera for your progress photos.
        NSPhotoLibraryAddUsageDescription: Save progress photos and collages to your library.
        SUPABASE_HOST: $(SUPABASE_HOST)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.divyanshu.form
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  FormTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FormTests
    dependencies:
      - target: Form
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Form:
    build:
      targets:
        Form: all
        FormTests: [test]
    test:
      targets:
        - FormTests
